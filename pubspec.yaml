name: henhaven_dash
description: "Henhaven Dash - a cozy farm cooking time-management game"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Game engine
  flame: ^1.24.0

  # Audio (SFX + BGM), used via Flame's audio pool for low-latency SFX
  flame_audio: ^2.10.7

  # Persistence for coins, upgrades, unlocked recipes, daily tasks, best score
  shared_preferences: ^2.5.3

  # Privacy Policy / Support screens
  webview_flutter: ^4.13.0

  # Keeps the device screen on while playing (avoids mid-level sleep/lock)
  wakelock_plus: ^1.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Generates Android adaptive icons + iOS icons from a single source
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/ui/
    - assets/images/backgrounds/
    - assets/images/chef/
    - assets/images/clients/
    - assets/images/food/
    - assets/images/ingredients/
    - assets/images/kitchen/
    - assets/images/decor/
    - assets/images/effects/
    - assets/images/rewards/
    - assets/sounds/

  fonts:
    - family: Baloo2
      fonts:
        - asset: assets/fonts/Baloo2-Variable.ttf
          weight: 400
        - asset: assets/fonts/Baloo2-Variable.ttf
          weight: 500
        - asset: assets/fonts/Baloo2-Variable.ttf
          weight: 600
        - asset: assets/fonts/Baloo2-Variable.ttf
          weight: 700
        - asset: assets/fonts/Baloo2-Variable.ttf
          weight: 800
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon_legacy.png"
  adaptive_icon_background: "#F2760F"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  min_sdk_android: 21
  remove_alpha_ios: true
